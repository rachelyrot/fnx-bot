# Eval set: real customer questions.
#   expect: answer   -> should answer; expected_urls = url substrings, any one counts as a hit
#   expect: refuse   -> should say "not on the site" (no_info)
#   expect: referral -> personal policy / advice / off-topic: explain + refer, no invented personal facts
#   follow_up        -> asked right after the previous question, in the same conversation

- id: water-claim
  q: יש לי נזילה בבית, איך אני מגישה תביעה?
  expect: answer
  expected_urls: [claims-appartment-insurance/pipeline-damage, claims-appartment-insurance, water]
- id: water-claim-time
  q: ותוך כמה זמן מקבלים תשובה?
  follow_up: true
  expect: answer_or_refuse
  expected_urls: [claims-appartment-insurance, claims_settlement]
- id: water-claim-policy
  q: האם הפוליסה שלי מכסה את זה?
  follow_up: true
  expect: referral
- id: serious-illness-time
  q: תוך כמה זמן מטפלים בתביעה על מחלה קשה?
  expect: answer
  expected_urls: [chronic-illness/faq, claims-serious-illness]
- id: serious-illness-docs
  q: אילו מסמכים צריך להכין לתביעת מחלות קשות?
  expect: answer
  expected_urls: [chronic-illness/faq, claims-serious-illness]
