[project]
name = "fnx-bot"
version = "0.1.0"
description = "RAG chatbot answering customer questions from the public fnx.co.il site (LlamaIndex + Cohere + Pinecone + Claude)"
readme = "README.md"
authors = [
    { name = "rachely", email = "rh3224430@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-cohere>=0.9.0",
    "llama-index-llms-anthropic>=0.12.3",
    "llama-index-llms-cohere>=0.9.0",
    "llama-index-postprocessor-cohere-rerank>=0.10.0",
    "llama-index-vector-stores-pinecone>=0.9.0",
    "netfree-unstrict-ssl>=0.1.3",
    "pinecone>=9.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
