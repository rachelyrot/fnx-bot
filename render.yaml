# Render Blueprint: the FastAPI chat server (app.py). The web UI is served by Vercel (web/vercel.json).
services:
  - type: web
    name: fnx-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NETFREE_UNSTRICT_SSL  # no NetFree in the cloud: keep SSL verification strict
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false  # asked for in the dashboard, never stored in the repo
      - key: COHERE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
